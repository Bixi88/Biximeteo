name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# serve per poter creare la release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build release APK
        run: gradle assembleRelease -PbuildNumber=${{ github.run_number }} --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meteo-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$APK" "Biximeteo-${{ github.run_number }}.apk"
          gh release create "build-${{ github.run_number }}" "Biximeteo-${{ github.run_number }}.apk" \
            --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "APK generato automaticamente dalla build #${{ github.run_number }}" \
            --latest
